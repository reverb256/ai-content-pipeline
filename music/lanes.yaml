# music/lanes.yaml — declarative lane registry.
# Genre x lane are orthogonal axes: a genre declares its lane set, this file
# defines what each lane IS (surface, bot, gate, requirements).
#
# Schema per lane (required keys: surface, bot, gate — registry.py enforces):
#   surface:      platform(s) the lane publishes to
#   bot:          owning bot for the stage
#   publisher:    upload executor (where different from bot)
#   gate:         the gate that must pass before publish
#   requires:     artifacts the package must carry
#   notes:        platform policy, bans, economics
#
# Source: brain/playbooks/music-lane-architecture.md §3.
#
# sync-documentary is ADDED here (not in the doc's §3 listing) because the
# doc's §2 activist genre block declares it in its lanes. It is the sync
# specialization for documentary/film — the activist notes call it "the pro
# outlet". registry.py validate FAILS on any genre lane that has no block
# here, so the lane must exist for the registry to pass.

version: 1

lanes:

  youtube-longform:
    surface: youtube
    shape: album-30-60min
    bot: videobot
    publisher: publishbot
    gate: gate_youtube_authentic     # inauthentic-content policy check
    revenue: ads                      # $1-5 RPM music; 2-3x for 30-60min albums

  youtube-mix:
    surface: youtube
    shape: mix-60min
    bot: videobot
    publisher: publishbot
    gate: gate_youtube_authentic

  youtube-gaming:
    surface: youtube
    shape: loop-10min
    bot: videobot
    publisher: publishbot
    gate: gate_youtube_authentic
    notes: "Gaming-music channels; loopable visual + tracklist."

  streaming:
    surface: distributor
    bot: distributor
    publisher: distributor
    distributor: distrokid             # $24.99/yr, no caps, no exclusions
    alt_distributor: tunecore          # Suno partner-model tracks eligible
    gate: gate_release_ready
    requires: [ai_disclosure, isrc, metadata, master]

  sync:
    surface: songtradr,audiosparx
    bot: distributor
    gate: gate_sync_ready              # stems + metadata + clearance doc
    requires: [stems, metadata, clearance_doc, instrumental_version]

  sync-documentary:
    surface: songtradr,audiosparx
    bot: distributor
    gate: gate_sync_ready
    requires: [stems, metadata, clearance_doc, instrumental_version]
    notes: "Sync specialization for documentary/film — the activist genre's pro outlet. Same clearance requirements as sync; buyer is a production, not a library."

  direct-license:
    surface: own-site
    bot: distributor
    gate: gate_sync_ready
    requires: [stems, license_tiers]

  direct-fan:
    surface: patreon,ko-fi
    bot: socialbot
    gate: gate_human_approval

  game-assets:
    surface: itch.io,unity-asset-store,gamedev-market
    bot: distributor
    gate: gate_sync_ready
    requires: [stems, loop_point, seamless_loop, metadata]
    notes: "Loopable + seamless loop points mandatory. Indie devs buy asset packs."

  stock-ai-native:
    surface: loudly,soundraw,musicapi
    bot: distributor
    gate: gate_release_ready
    notes: "ONLY remaining stock door. Pond5/AudioJungle/Artlist/Epidemic all ban AI."

# ------------------------------------------------------------------
# Stage gates — which gate guards a producing stage (added 2026-10-16,
# card t_d9983bb9).
#
# music/stages.yaml named `gate_youtube_authentic` in the `visual` stage prompt
# unconditionally, so a genre with no YouTube lane (activist: direct-fan,
# sync-documentary, streaming) had its video gated against a surface it never
# publishes to. That is the same defect shape as a gate rejecting a lane name:
# the stage machine could not see that the gate and the genre's lane set disagree.
#
# So each stage gate is resolved from the GENRE'S OWN LANES rather than hardcoded
# in the stage prompt:
#   selector:    lane_gate  — resolve from the genre's lane set
#   gate:        the gate that guards the surfaces those lanes publish to
#   when_absent: none       — no lane in this genre is guarded by `gate`; the
#                             stage runs NO gate for it and must SAY SO on the
#                             card. A gate for a surface the genre never
#                             publishes to is a false check, not a missing one.
#   why:         the reasoning, so the choice is auditable without code reading.
#
# Read it with:
#   /usr/bin/python3 music/registry.py gate-for-stage --stage visual --genre <g>
# `registry.py validate` fails when the named gate has no script, or when no lane
# declares it (a stage gate that can never fire is a silent no-op).
stage_gates:

  visual:
    selector: lane_gate
    gate: gate_youtube_authentic
    when_absent: none
    why: "The rendered video is gated against the policy of the platform it is
      published to. Only the YouTube lanes are guarded by gate_youtube_authentic
      (inauthentic-content policy: shot diversity, variation vs prior uploads) —
      their `surface: youtube` is what makes that gate the right one. A genre with
      no YouTube lane publishes no video through a lane that has such a policy,
      so the stage runs no video gate and states that on the card."
