# Lyric blueprint — anime-ending (family: anisong)
# Data, not code. The writer writes the actual lyrics from this brief.
#
# ADDED 2026-10-16 (card t_a14e5d52). Before this file the genre had no tempo
# anchor: planner.py::bpm_anchor_for() resolves blueprint -> caption -> nothing,
# so the plan's bpm came from a number parsed out of the caption prose and
# "_meta": {"blueprint": false}. This file makes the tempo, the structure and the
# avoid-list a reviewed decision in the repo instead.
#
# The key set is copied from music/lyrics/blueprints/chill-lounge.yaml (the schema
# planner.py reads). Section tags MUST match music/prompts/anime-ending.md
# exactly, order included: validate() fails a plan whose [tags] differ from the
# blueprint's structure.
genre: anime-ending
family: anisong
theme: >-
  The last light of the album. The arc is over. The thing that was lost is named
  once, and then left in the room. Bittersweet and hopeful at once — this is the
  exhale after the opening's explosion, not a second explosion.
voice_notes: >-
  Intimate, first person, close-mic. Japanese script only (kana/kanji, never
  romaji — Suno mispronounces romanization). Density of MEANING, not energy:
  every line carries the episode's emotional residue, and phrases are allowed to
  breathe. Space between notes is the ballad's equivalent of the opening's
  double-kick. The chorus states the title phrase once.
rhyme: >-
  Japanese prosody, not English rhyme. Match the template's 4-8 line sections by
  syllable weight. Never pad a line to reach a rhyme, and never invert a clause
  to manufacture one.
line_length: "Japanese script; 4-8 lines per verse, 2-4 per pre-chorus, 4-8 per chorus; singable in one breath"
bpm_anchor: 92
mood_words: [last light, window, quiet, winter, photograph, morning, ash, hand]
avoid: >-
  EDM, heavy drums, distorted guitars, rap, autotune, English lyrics; a full drum
  kit at bar one (brushes and rim clicks enter no earlier than verse 2); a
  hard-cut or pop-fade ending — this genre fades the light, not the door; the
  wardrobe of generic ballad cliches (baby, forever, tonight as filler).
title_candidates:
  - "Reflections"
structure:
  - tag: "Intro"
    guidance: "Japanese: 2 lines, sparse. Piano alone, one string sustain. The hook melody arrives in fragment — endings plant the chorus seed early."
  - tag: "Verse 1"
    guidance: "Japanese: 4-8 lines. Intimate, first-person. The memory or the person the episode left behind. Plain words, close-mic vocal feel, piano + bass only."
  - tag: "Pre-Chorus"
    guidance: "Japanese: 2-4 lines. Strings enter, drums brush in, the line lengthens — the first swell."
  - tag: "Chorus"
    guidance: "Japanese: 4-8 lines. The emotional core, singable, IV-V-iii-vi royal road. Full strings + piano + bass together. Title phrase repeated once."
  - tag: "Verse 2"
    guidance: "Japanese: 4-8 lines. The cost named honestly — what was gained, what was left. Same meter as verse 1, guitar arpeggios join the piano."
  - tag: "Pre-Chorus"
    guidance: "Japanese: repeat, fuller, drums settle to a groove."
  - tag: "Chorus"
    guidance: "Japanese: repeat, bigger — brass-free, strings carry."
  - tag: "Bridge"
    guidance: "Japanese: 2-4 lines. Strip to piano + voice again. The quietest point of the song; this is where the listener remembers the episode's last scene."
  - tag: "Final Chorus — KEY LIFT"
    guidance: "Japanese: the same words, a gentle lift up a key — the ending's version of the opening's key change, but warm, not explosive. Strings swell an octave, vocals reach up, then settle."
  - tag: "Outro"
    guidance: "Japanese: 1-2 lines. The final line hangs on a single held piano note, long reverb tail into silence. No hard cut — the ending fades the light, not the door."
notes: >-
  Lane fit: streaming, sync, direct-license, youtube-longform. This track is
  track 9 of the Virtual Reflections album, so its video shape is
  album-30-60min and it sits inside the album video rather than a single. The
  craft contract is the template's: 85-100 BPM ballad pocket (92 pinned),
  IV-V-iii-vi royal road landing on the minor vi, a warm key lift in the final
  chorus, brushes from verse 2, and a tail that fades into silence. Lyrics are
  human-authored — queue it with lyricsMode draft and let j_kro claim the sheet;
  AI-written lyrics void the copyright claim this pipeline registers.
