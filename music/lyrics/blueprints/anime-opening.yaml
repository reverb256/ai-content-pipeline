# Lyric blueprint — anime-opening (family: anisong)
# Data, not code. The writer writes the actual lyrics from this brief.
#
# ADDED 2026-10-16 (card t_53da62e5). Before this file the genre had no blueprint
# under music/lyrics/blueprints/, so planner.py::bpm_anchor_for() fell back to a BPM
# parsed out of the caption prose, the plan carried "_meta": {"blueprint": false},
# and the lyrics stage had nothing to scaffold from. music/prompts/anime-opening.md
# is the registry's write-to spec for this genre; this file makes its tempo, its
# structure and its avoid-list a reviewed decision in the repo.
#
# The key set is copied from music/lyrics/blueprints/chill-lounge.yaml (the schema
# planner.py reads). Section tags MUST match music/prompts/anime-opening.md exactly,
# order and repeats included: planner.py::validate() fails a plan whose [tags] differ
# from this list, and the repeated Pre-Chorus/Chorus pair IS the anisong shape
# (V1-PC-C-V2-PC-C-B-FINAL-C-O). Sibling file: blueprints/anime-ending.yaml.
genre: anime-opening
family: anisong
theme: >-
  The first thirty seconds of the arc. Someone is running toward a thing they have
  not named yet, and the sky opens above them. A story starts, and the song is the
  shape of starting. Triumphant and urgent at once: the joy carries the ache, not
  the other way around.
voice_notes: >-
  Japanese in Japanese script only — kana and kanji, never romaji (Suno
  mispronounces romanization). Idol-rock energy: open vowels, forward placement,
  the chorus pushed to the top of the range. Information density is the genre
  standard, so every line carries an image and a verb. The hook phrase repeats in
  the chorus and returns one key higher at the end. No English lines, no whispered
  intimacy — this vocalist projects to the back of the hall.
rhyme: >-
  Japanese prosody, not English rhyme. Carry sections on vowel assonance and
  matched mora counts. Verse 2 repeats verse 1's meter so the density reads as one
  voice. Never pad a line to reach a rhyme, and never invert a clause to
  manufacture one.
line_length: "Japanese script; 4-8 lines per verse, 2-4 per pre-chorus, 4-8 per chorus, 2-4 per bridge; short, per-beat lines"
bpm_anchor: 160
mood_words: [dawn, running, sky, fist, horizon, scar, wind, light]
avoid: >-
  acoustic folk, lo-fi, trap beats, EDM drop, rap verse, ballad, English lyrics;
  romaji lyrics; a long ambient intro (the hook must land inside 15 seconds); a
  fade-out or a soft ending (the last hit cuts like a TV edit to black); a final
  chorus in the original key (without the lift the track reads as generic rock);
  dropping "rock" or "orchestral" from the sound — they ARE this idiom; filler
  ("baby", "tonight"), "city lights"/"neon" as the only image, brand names.
title_candidates:
  - "Becoming"
  - "Opening Theme"
  - "First Light"
structure:
  - tag: "Intro"
    guidance: "Japanese: 2-4 lines. High energy from bar one. A hook fragment — the chorus melody in embryo, over drums and bass only. No buildup waste: an opening must hook inside 15 seconds."
  - tag: "Verse 1"
    guidance: "Japanese: 4-8 lines. Dense, story-forward. Melodic bass eighth-notes under piano + strings. Who is running, and toward what — information per bar is the genre standard."
  - tag: "Pre-Chorus"
    guidance: "Japanese: 2-4 lines. Tension climb: short lines, rising pitch, drums open up, riser into the chorus."
  - tag: "Chorus"
    guidance: "Japanese: 4-8 lines. The soaring singable hook, title phrase repeated. IV-V-iii-vi royal road carries it; full band + strings + brass stabs together. Land the hook in line 1."
  - tag: "Verse 2"
    guidance: "Japanese: 4-8 lines. Same density and meter as verse 1, new imagery: the cost of the run, the person running beside them. Bass runs busier, one guitar counter-line."
  - tag: "Pre-Chorus"
    guidance: "Japanese: repeat, bigger. Raise the register and open the drums further."
  - tag: "Chorus"
    guidance: "Japanese: repeat, bigger. One word may change; keep the hook itself identical."
  - tag: "Bridge"
    guidance: "Japanese: 2-4 lines. Strip to piano + strings + voice, half-time feel for two bars — the breath before the final chorus. This silence is load-bearing."
  - tag: "Final Chorus — KEY CHANGE UP ONE SEMITONE/TONE"
    guidance: "Japanese: the SAME chorus words, now one semitone or one tone higher. Vocals reach for the top of the range, strings doubled an octave higher, full band at maximum. THE SIGNATURE MOVE — omit it and the track reads as generic rock."
  - tag: "Outro"
    guidance: "Japanese: 1-2 lines or a shouted title phrase, then a hard unison final hit. No fade-out — the ending must cut like a TV edit to black."
notes: >-
  Lane fit: streaming, sync, direct-license, youtube-gaming. Shape single-4min:
  this is a SHOWPIECE, not a loop, and it must survive a 90-second TV cut with the
  arc intact (hook -> verse -> pre-chorus -> chorus -> bridge -> final chorus).
  Tempo 130-180 BPM, J-rock pocket 160-170 (160 pinned here); below 130 drifts to
  pop-rock, above 180 to speed-metal. The busy double-kick pattern and the
  eighth-note melodic bass are the engine; strings AND piano over rhythm guitars
  with synth pads underneath is the post-2010s anison wall of sound. Stems are
  mandatory for the sync and direct-license lanes. Lyrics are human-authored —
  queue the plan with lyricsMode draft and let j_kro write and claim the sheet;
  AI-written lyrics void the copyright claim this pipeline registers. Consumed by
  the Virtual Reflections album, tracks 7-8 ("Opening Theme", "Becoming"). One open
  flag: the youtube-gaming lane renders loop-10min while this genre's shape is
  single-4min, so that lane needs a second render or it stays unreached.
