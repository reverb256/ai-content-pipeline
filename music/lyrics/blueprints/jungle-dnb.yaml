# Lyric blueprint — jungle-dnb (family: edm)
# Data, not code. The writer writes the actual ragga toast from this brief.
#
# ADDED 2026-10-16 (card t_e6d422ec). Before this file the genre was broken in
# three measured ways:
#   * lyrics.py::cmd_scaffold refused to start the lyrics stage. Measured:
#     `/usr/bin/python3 music/lyrics/lyrics.py scaffold --genre jungle-dnb`
#     -> rc=2, "FAIL: no lyric blueprint for 'jungle-dnb'". That stage is
#     REQUIRED here: this is a vocal genre.
#   * planner.py had no anchor to read. Measured before this file,
#     `planner.py show --genre jungle-dnb` printed "structure_source": "template",
#     "blueprint": false, "bpm_anchor": null. After it, structure_source flips to
#     "blueprint" and bpm_anchor reads 168.
#   * the chart's check-queue-sync.sh FAILS any `draft` entry whose genre has no
#     blueprint in the payload, which is what held the jungle-dnb queue entry
#     (reproduced on a sandbox copy of the real chart: entry alone rc=1, entry
#     plus this file rc=0 — card t_97c92df2 §4).
#
# THIS GENRE IS VOCAL, NOT INSTRUMENTAL. The "## Lyrics guidance" block of
# music/prompts/jungle-dnb.md carries 0 instrumental markers and names a ragga
# toast in two of its three hooks. 8 of the 14 templates declare Suno's
# instrumental path; this one does not. Do not queue it with
# `instrumental: true` or `lyricsMode: instrumental`.
#
# Section tags MUST match music/prompts/jungle-dnb.md exactly, order and repeats
# included: planner.py::validate() fails a plan whose [tags] differ from this
# structure. The template's own 7 tags are
# Intro-Break-Hook-Break-Hook-Break-Outro; the repeated Break/Hook pair IS the
# arrangement, so the repeats stay.
#
# The sheet this blueprints must clear the lyrics gate
# (music/gates/gate_lyrics_original.py, MIN_UNIQUE_WORDS = 25):
#   * >= 25 DISTINCT tokens, and the tokenizer is `[a-z']+`
#     (music/lyrics/lyrics.py::WORD_TOKEN_RE, read 2026-10-16). A HYPHEN splits a
#     word ("sound-bwoy" measures as "sound" + "bwoy") and digits count for
#     nothing, so write chant syllables UNHYPHENATED. A four-word chant repeated
#     through all 7 sections does not clear the floor.
#   * EVERY section needs at least one sung line, Breaks included: validate()
#     rejects a section whose lines are all parenthetical or all blank. In this
#     genre the Breaks carry the chant; they are not silence on the sheet.
#   * the template's section map is NOT lyrics and is NOT copyrightable. It is a
#     working sheet, not a release sheet (brief §2 and §4).
#
# Authorship: the sheet is a HUMAN claim. Queue this genre as `lyricsMode: draft`
# and let j_kro write the toast. AI-written words void the SOCAN and distributor
# path that the registry default `lyrics: human-original` exists to protect.
genre: jungle-dnb
family: edm
theme: >-
  A soundsystem jungle record: 168 BPM drums over an ~84 BPM bassline, built from
  chopped breaks rather than loops, with a ragga toast on the slow grid. It has
  to sound like UK pirate radio in 1994, not like a modern DnB roller. The toast
  is a crowd address, not a confession: the room, the sub weight, the rewind, and
  the one night the soundsystem tells it again.
voice_notes: >-
  Ragga toasting on the SLOW grid — the voice rides the bassline at half the drum
  tempo (~84 BPM feel) and never chops to the fast break. 2-4 short chantable
  lines per hook, one breath each, addressed to the room ("massive", "rewind",
  "forward", "selection"). Call-and-response: a lead line, then its chopped
  answer. Dancehall phrasing and patois cadence are the target, and the toasting
  IS the hook, so intelligibility has to survive the drops. An MC on a
  soundsystem, never a singer in a booth: no story, no confession, no verses.
rhyme: >-
  Toast rhyme, not pop rhyme. The hook is repetition: a chant phrase lands, the
  answer echoes it, and the pair returns until the rewind. Identical end-words
  and slant rhymes are wanted (rewind/behind, pressure/answer, massive/passage);
  AABB is a coincidence, not a requirement. Never pad a line to reach a rhyme and
  never invert a clause to manufacture one. If a rhyme needs a word from outside
  soundsystem vocabulary, drop the rhyme and keep the cadence.
line_length: "2-4 lines per Hook, 4-8 syllables each, one breath per line; 1-3 lines in Intro and Outro; a Break repeats a chant line rather than opening a new subject"
bpm_anchor: 168
mood_words: [soundsystem, rewind, pressure, massive, dubplate, siren, forward, bassline]
avoid: >-
  liquid DnB rollers, pop EDM, half-time dubstep, autotune R&B, stadium house —
  the template's own Exclude Styles, unaltered; clinical modern DnB, the drift
  the template names (words that sell polish over pressure); "hands in the air",
  "put your hands up", "bass drop" — festival-pop address, not soundsystem
  address; sung R&B melisma and autotune runs; the pop wardrobe (baby, forever,
  tonight as filler); a narrative that needs a verse to carry it — this genre has
  chants, not verses.
title_candidates:
  - "Two Speeds"
  - "Slow Grid Toast"
  - "Wheel It Forward"
structure:
  - tag: "Intro"
    guidance: "Dub siren, airhorn, one vocal chant to open — the rewind call the template's own example makes. 1-3 lines, no drums needed yet. Set the room; do not start the story."
  - tag: "Break"
    guidance: "Break states once, sub-bass slides in underneath. Hold the Intro chant or one crowd address, so the section is not bare."
  - tag: "Hook"
    guidance: "Ragga toast, 2-4 short lines, crowd-addressing. This is the hook the room shouts back: land the title phrase or its key word here."
  - tag: "Break"
    guidance: "Break re-chops, ghost snares, the bass answers the kick. Hold the hook's chant or answer it once — no new subject."
  - tag: "Hook"
    guidance: "Call-and-response: a lead vocal line, then a chopped vocal answer. Same chant as the first Hook with the answer added; the pair is the section."
  - tag: "Break"
    guidance: "Filtered break and bass for tension, then full pressure returns. One held line or the chant again — the section still carries words."
  - tag: "Outro"
    guidance: "Break subtracts, dub delay trails, siren fades. 1-2 lines: a last crowd address, or the chant dissolving. No resolution statement."
notes: >-
  Lane fit: streaming, youtube-mix, direct-license (registry `music/genres.yaml`).
  Beatport is closed to this genre — the same ban as trance (2026-08-12) — so
  those three lanes are the compensation, and `direct-license` wants STEMS as
  well as the master. The plan this blueprints should carry `bpm: 168` and
  `duration: 300` (the queue entry pins both). The two speeds are the product:
  drums at 168, bass written at half that, which is why the anchor is 168 and not
  84. The three titles above were name-searched 2026-10-16 and no released track
  in this genre carries them; `[0]` is also the track-dir slug
  `music/lyrics/jungle-dnb/two-speeds` that `lyrics.py scaffold` writes, so
  changing `[0]` moves the directory. j_kro owns the release title — these are
  candidates, not the decision. The sheet is human-authored: write the toast,
  then record the claim with `lyrics.py claim --author`, and remember the
  scaffold's parenthetical lines are direction, not sung lines.
