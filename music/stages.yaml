# music/stages.yaml — stage → bot map for the MUSIC board.
# The pipeline driver (scripts/automation/pipeline-driver.sh) reads this
# file when BOARD=music, so the music lane is data-driven: adding a
# stage means adding a block here, never editing the driver.
#
# Schema (driver contract — same as scripts/automation/stages/):
#   stage:            kanban stage label (the "stage: <stage>" marker)
#   bot:              hermes profile to dispatch
#   prompt:           the stage prompt. {card} -> kanban task id,
#                     {board} -> board slug, at dispatch time.
#   human_gate: true  NEVER auto-dispatch. Parked for j_kro / a human.
#   auto_next: <stage>  (human gates only) advance target after approval.
#
# STAGE ADVANCE (added 2026-10-16 t_38e84953; advance CHANNEL fixed t_5a93164a)
# -------------------------------------------
# The driver picks a card up at whatever stage marker it carries, and it
# re-reads that marker every 30 min. A stage prompt that does not move the
# marker leaves the card where it is, so the driver re-dispatches the SAME
# stage forever. Every producing prompt below therefore ends with an explicit
# advance step, and that step must be reachable from the caller that runs it.
#
# TWO callers run a music stage, and they need DIFFERENT channels:
#   * the driver dispatches a plain `hermes -p <bot> chat` (no kanban toolset,
#     unfenced env) -> the CLI works: bash scripts/automation/advance-stage.sh
#   * the generic kanban dispatcher spawns a kanban WORKER; its terminal and
#     every subprocess it starts are fenced, so `hermes kanban --board music
#     comment` is refused with "delegate_task child contexts cannot mutate
#     Kanban tasks via the CLI" and exits 1 (t_5a93164a) -> only the
#     kanban_comment TOOL works.
# So each prompt names the TOOL first, keeps the CLI as a labelled fallback,
# and requires the caller to CHECK the exit status. Checked by
# music/scripts/check_stage_advance.py.
#
# The --board music flag stays required on the CLI fallback: advance-stage.sh
# defaults to faceless-youtube, and before t_38e84953 every music advance was
# written to the wrong board (the marker never moved).
#
# THE MARKER (t_669bb02b): a marker is a LINE that IS `stage: <next-stage>` —
# nothing before it and nothing after it on that line — written in the card body
# or in a comment body. The driver reads markers through
# scripts/automation/stage_marker.py, which never reads a run summary, a result
# or an event: `hermes kanban show` prints the run summary AFTER the comments, so
# before t_669bb02b a summary reading "...the stage: advance-stage.sh was
# refused..." captured the read and the card stalled on an undeclared stage.
# Post the marker as its own line, and never write a lone `stage: <word>` line
# anywhere else in the card. music/scripts/check_stage_markers.py FAILs any card
# the driver would dispatch when the card's text and the convention disagree.
# A stage whose gate FAILS must
# NOT advance — it stays put and the maker reworks it.
#
# Stage list: brain/playbooks/music-lane-architecture.md §4.
# Bots are existing hermes profiles (verified `hermes profile list`):
#   producer, writer, reviewer-deepseek, videobot, publishbot,
#   distributor, analyst.
# RENDER OUTPUT CONTRACT (added 2026-10-16 t_320bae4c)
# -----------------------------------------
# The render rail (`music-pipeline-render` in mining-k8s, which runs
# music/scripts/acestep_plan.py) lands a finished render at ONE path, and every
# stage below that consumes a master reads it THERE:
#
#   host (nexus) : /var/lib/music-plans/<plan-stem>.<ext>
#   pod          : /plans/<plan-stem>.<ext>   (the same directory, mounted)
#
# <plan-stem> is the plan JSON's own file name (/var/lib/music-plans/<stem>.json);
# <ext> is the container the engine produced (ace -> .flac, fixture -> .wav).
# The rail asserts this file exists after EVERY render, before it writes a
# success `<stem>.rendered` marker, with
# music/scripts/check_render_landed.py — so a change to the rail cannot move a
# render away from this path silently:
#
#   python3 music/scripts/check_render_landed.py --check \
#       --plans /var/lib/music-plans --stem <plan-stem> \
#       --host-path /var/lib/music-plans          # rc 0 landed, 1 missing,
#                                                 # 3 the rail was MOVED
#   python3 music/scripts/check_render_landed.py --print-contract
#
# These are NOT the pack stage's input (both are the engine's own copies, not
# the rail's output): /var/lib/sunolocal/artifacts/suno-<job-key>.<ext> (named by
# the job key, not the plan stem; reachable through the task's `audio_url`) and
# zephyr's ~/Music/acestep/suno-<...>.flac (ComfyUI's own output directory).
#
# RENDER LOG CONTRACT (added 2026-10-16 t_d6b0cb36)
# -----------------------------------------
# `music/quota-ledger.json` is the pipeline's only durable render log — its own
# `_renders_note` says so — and its `renders:` list is EVIDENCE, not a counter
# (a local ACE render consumes 0 downloads, 0 studio exports, 0 credits; the
# counters above are what `gate_quota` reads).
#
# EVERY DELIVERED RENDER IS IN IT. A marker the rail reads as a finished render
# (render_state.py: an empty `<stem>.rendered`, or `rendered <plan-sha> <utc>`)
# must have exactly ONE entry in that list, named by the plan stem:
#
#   python3 music/scripts/check_render_ledger.py --check \
#       --plans /var/lib/music-plans --ledger music/quota-ledger.json
#                                     # rc 0 in step, 1 a delivered render is
#                                     # NOT in the log, 3 the check cannot answer
#
# THE RAIL CANNOT WRITE THIS FILE, so do not expect it to: the render pod mounts
# its payload readOnly from the chart's ConfigMap and its only writable volume is
# the plans hostPath, while the ledger is a file in THIS repo (music/oracle.py
# reads it) — `grep -rn quota-ledger ~/mining-k8s` finds nothing. The recorder
# derives an entry from LIVE state (the plan, the master at the documented render
# path, the engine artifact store, the sunolocal job store) and cannot
# double-record, because it is keyed on `name`:
#
#   python3 music/scripts/check_render_ledger.py --record --stem <plan-stem> \
#       [--card t_xxxxxxxx] [--note "<evidence the recorder cannot measure>"]
#   python3 music/scripts/check_render_ledger.py --backfill
#
# NEVER write an entry for a `.refused` marker: a refusal is a draft waiting on a
# human, not a delivered render. The scheduled home of the check is section 2c of
# music/scripts/run_gate_matrix.sh (daily, nexus), which exits 4 for a log that is
# out of step so it is never read as a broken gate.
#
# DERIVED PRODUCT CONTRACT (added 2026-10-16 t_eb079b91)
# -----------------------------------------
# The `asset-pack` stage builds the DERIVED product of a finished master for the
# `game-assets` lane. Before it existed, the generator (music/assets/pack.py)
# and its two gates were wired to nothing: `music/stages.yaml` declared 14
# stages and not one of them ran the generator, so the primary lane of all six
# gamer genres ended at a master plus a manual step.
#
# Position — AFTER `gate`, BEFORE `package`. The pack derives from a master the
# independent quality gate already vetted; building it earlier would spend CPU
# on a master the reviewer may reject. It is NOT the `package` stage: a pack is
# not a release package (different shape, different gate — §13).
#
# The stage prompt hardcodes NOTHING about which genres build a pack, which
# generator runs, or where output goes. It calls:
#
#   /usr/bin/python3 music/registry.py derived-for-stage \
#       --stage asset-pack --genre <genre> [--master <wav>] [--bpm N] [--key K]
#
# which resolves the product from the GENRE'S LANES (lanes.yaml
# `game-assets.derived_product`), prints the exact command, and answers
# `build: no` for a genre whose lanes do not include game-assets. The same
# selector shape as `gate-for-stage` (card t_d9983bb9), for the same reason: a
# decision hardcoded in a prompt cannot see that the prompt and the registry
# disagree.
#
# Output convention: packages/<master-stem>-asset-pack (repo root) — the
# generator's own default, keyed to the master's stem so two tracks cannot share
# a pack directory. The generator records pack-relative paths relative to that
# tree, so `--out` MUST stay under <repo>/packages/<name>.
#
# Publish is untouched: the itch.io draft goes through publishbot behind the
# `human-approval` gate. The stage never uploads (butler is not installed here,
# card t_8a715681).
#
# Guarded by music/scripts/check_pack_stage.py (--selftest carries the failure
# shapes: a product with no stage, a product whose stage is a human gate, a
# prompt that names no resolver, and a prompt that uploads).
#
version: 1

stages:
  - stage: brief
    bot: producer
    prompt: "Run the brief stage for kanban task {card} (board music). FIRST check whether this genre's brief already exists — briefs are keyed by GENRE (music/briefs/<genre>.md or music/briefs/<genre>/<slug>/brief.md), and /usr/bin/python3 music/stage_state.py --genre <genre> prints whether it is already delivered. If it is, do NOT write or re-measure it: resolve the existing artifact, comment that it is delivered and verified, and advance without any writing work (card t_6599927d — 13 runs paid for this on 2026-10-16). Resolve the genre + lane + intent from the music registry (music/genres.yaml, music/lanes.yaml via music/registry.py). Write the brief: genre, target lanes, cadence, video shape. Save + comment on the kanban task. Then advance the card to genre-select: post the marker 'stage: genre-select' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} genre-select --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: genre-select
    bot: producer
    prompt: "Run the genre-select stage for kanban task {card} (board music). Resolve the genre to a complete registry entry (music/genres.yaml). Verify the entry exists and every referenced lane exists in music/lanes.yaml. Save the resolved entry + comment. Then advance the card to lyrics: post the marker 'stage: lyrics' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} lyrics --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: lyrics
    bot: writer
    prompt: "Run the lyrics stage for kanban task {card} (board music). Write ORIGINAL human-authored lyrics (copyrightable — never Suno-generated). Record the authorship claim per music/registry.py conventions. Save the lyric sheet, then run the lyrics gate: python3 music/gates/gate_lyrics_original.py. Comment the result. If the gate PASSES, advance the card to generate: post the marker 'stage: generate' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} generate --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance. If it FAILS, do NOT advance. NOTE: an instrumental genre (music/prompts/<genre>.md says the lyrics box stays empty) skips this stage — advance it by posting the marker 'stage: generate' with the kanban_comment tool and saying the genre is instrumental."

  - stage: generate
    bot: producer
    prompt: "Run the generate stage for kanban task {card} (board music). FIRST run the quota gate (python3 music/gates/gate_quota.py) — never outrun the 60/month standard-download cap. Then generate 2 tracks via Suno CDP (music/suno-gen.py) on the logged-in Premier session. Export ONLY through Suno Studio (unlimited), never the standard download button. Save tracks + comment. Then advance the card to curate: post the marker 'stage: curate' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} curate --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: curate
    bot: producer
    prompt: "Run the curate stage for kanban task {card} (board music). Listen to the generated tracks, pick the winner, record a reject reason for each loser. Save the curation note + comment. Then advance the card to stems: post the marker 'stage: stems' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} stems --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: stems
    bot: producer
    prompt: "Run the stems stage for kanban task {card} (board music). Export stems through Suno Studio (unlimited). Stems are MANDATORY for sync + direct-licensing. Save the stems, then run the stems gate: python3 music/gates/gate_stems_present.py --master <master> --stems-dir <dir>. Comment the result. Then advance the card to master: post the marker 'stage: master' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} master --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: master
    bot: producer
    prompt: "Run the master stage for kanban task {card} (board music). The finished render is at the DOCUMENTED render path — /var/lib/music-plans/<plan-stem>.<ext> on nexus — per the RENDER OUTPUT CONTRACT at the top of this file; <plan-stem> is the plan JSON's own file name, and <ext> is what the engine produced. Prove it is there before you touch it: python3 music/scripts/check_render_landed.py --check --plans /var/lib/music-plans --stem <plan-stem> --host-path /var/lib/music-plans (rc 0 = landed, 1 = it is NOT there, 3 = the rail has been MOVED off the documented path). On rc 1 or 3, do NOT substitute the engine's own copy (/var/lib/sunolocal/artifacts/suno-<job-key>.<ext> or zephyr ~/Music/acestep/): comment the measured path and the rc on {card} and stop. Loudness-normalize THAT master (-14 LUFS streaming / -16 sync, +/-1 dB). Save the master, then run the loudness gate: python3 music/gates/gate_loudness.py --master <master> --target streaming. Comment the result. Then advance the card to gate: post the marker 'stage: gate' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} gate --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: gate
    bot: reviewer-deepseek
    prompt: "Run the quality-gate stage for kanban task {card} (board music). Independent review on a DIFFERENT model than the producer. Judge the artifact against the music rubric (quality, originality, not template-slop). Record the verdict bound to the artifact hash, then run: python3 music/gates/gate_quality.py. If it fails, comment the specific findings and do NOT advance. You review; you do not redo the work. If it PASSES, advance the card to package: post the marker 'stage: package' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} package --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: asset-pack
    bot: producer
    prompt: "Run the asset-pack stage for kanban task {card} (board music). A pack is a DERIVED product of a finished master (music-lane-architecture.md §13). DECIDE FIRST whether this genre builds one — never assume: /usr/bin/python3 music/registry.py derived-for-stage --stage asset-pack --genre <the card's genre> (optionally add --master <master.wav> --bpm <plan bpm> --key <plan key>). It resolves from the GENRE'S LANES whether a lane of this genre sells a pack, names the generator, the interpreter, the output directory and the gates, and PRINTS THE EXACT COMMAND. If it answers 'build   : no', this genre has no lane that sells a pack: comment that on {card}, run no generator, and advance to package (a pack for a lane the genre does not declare is work nobody sells). If it answers 'run     : NO', the generator does not run under its pinned interpreter — comment that line verbatim and do NOT advance; install the missing module for that interpreter first (music/scripts/check_pack_stage.py). Otherwise run the command it printed, with the tempo and key the render was actually made at (the plan JSON at /var/lib/music-plans/<plan-stem>.json carries bpm + key) — the generator only ESTIMATES a tempo/key when none is stated, and an estimated key is a fabricated claim. CHECK THE COMMAND'S EXIT STATUS: rc 0 = the generator accepted the pack; rc 1 = it printed an acceptance block and REJECTED the pack (a master too short for its loop count cannot make a shippable pack) — comment that block and do NOT advance. The output directory is packages/<master-stem>-asset-pack, keyed to the master's own stem; do not invent a name. Then run BOTH gates it printed, against the pack: python3 music/gates/gate_sync_ready.py --package-dir <pack> --lane game-assets (pack mode measures every loop's seam), and python3 music/gates/gate_loop_points.py --pack-dir <pack> (every loop, PASS). A gate FAIL means the pack is reworked — do NOT advance. NEVER upload: the itch.io draft goes through publishbot behind the human-approval gate, and butler is not installed here. Comment the resolved answer, the command, the pack path and both gate results on {card}. Then advance the card to package: post the marker 'stage: package' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} package --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: package
    bot: producer
    prompt: "Run the package stage for kanban task {card} (board music). Build the release package: manifest, metadata, ISRC (ISO 3901), artwork, AI-disclosure flag. Then run: python3 music/gates/gate_release_ready.py. Comment the result. Then advance the card to visual: post the marker 'stage: visual' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} visual --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: visual
    bot: videobot
    prompt: "Run the visual stage for kanban task {card} (board music). Render the platform-native video for the genre's video_shape (music/genres.yaml: album-30-60min / mix-60min / loop-10min / lyric-video / single-4min). Then RESOLVE this stage's gate from the genre's OWN lanes — never assume the YouTube gate (card t_d9983bb9: activist has no YouTube lane, so gate_youtube_authentic checked a surface the genre never publishes to): /usr/bin/python3 music/registry.py gate-for-stage --stage visual --genre <the card's genre>. That command names the gate and the script to run it with, resolved from music/lanes.yaml stage_gates; it exits 2 rather than guessing when the genre is unknown. Run the gate it names against the rendered visual and comment the result. If it answers 'gate    : none', this genre has NO lane publishing to a surface that gate guards: run no video gate, and STATE THAT EXPLICITLY on {card} — a gate for a surface the genre never publishes to is a false check, not a missing one. A gate FAIL means the visual is reworked; do not advance. Save the MP4 + comment. Then advance the card to the HUMAN GATE: post the marker 'stage: human-approval' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} human-approval --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: publish
    bot: publishbot
    prompt: "Run the publish stage for kanban task {card} (board music). Upload PRIVATE / draft ONLY — never make public without human approval (review gate). Distribution goes through the distributor bot per the lane. Report the upload ID / draft URL. Then advance the card to track: post the marker 'stage: track' on {card} with the kanban_comment tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a). Without a kanban tool, run bash scripts/automation/advance-stage.sh {card} track --board music and check the exit status: 1 means the marker was NOT written and the card did NOT advance."

  - stage: track
    bot: analyst
    prompt: "Run the track stage for kanban task {card} (board music). Pull streams, revenue, and lane ROI. Feed the numbers back to the registry cadence weights. Post the analysis to the kanban task. Then close the card with the kanban_complete tool (the hermes kanban CLI is REFUSED for dispatcher-spawned workers — t_5a93164a), carrying the summary + metadata. Without a kanban tool, run hermes kanban --board music complete {card} and check the exit status."

  # Human gates — parked for j_kro. Never auto-dispatched.
  - stage: human-approval
    human_gate: true
    auto_next: publish
    prompt: "Run the human-approval gate for kanban task {card} (board music). j_kro's publish-approval gate (brain/playbooks/music-lane-architecture.md §7). A bot must never auto-pass this. On approval, j_kro advances the card to publish."

  - stage: escalate
    human_gate: true
    prompt: "Human gate — the card is parked awaiting j_kro. Never dispatch, never log-loop."

# Cards whose stage label is missing default to "brief" (the oracle
# creates them there). Unknown stages are logged and skipped.
default_stage: brief
